name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish_release_assets:
        description: "手动触发时是否上传到现有 release"
        required: false
        default: false
        type: boolean
      version:
        description: "手动构建时使用的版本号，例如 1.0.0"
        required: false
        type: string
      release_tag:
        description: "手动上传 release 资产时使用的 tag，例如 v1.0.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-macos-release:
    runs-on: macos-latest
    env:
      PROJECT: codexpanel.xcodeproj
      SCHEME: codexpanel
      ARM64_DERIVED_DATA: ${{ github.workspace }}/.github/tmp/release-derived-data-arm64
      X64_DERIVED_DATA: ${{ github.workspace }}/.github/tmp/release-derived-data-x86_64
      UNIVERSAL_APP_DIR: ${{ github.workspace }}/.github/tmp/universal-app
      DIST_DIR: ${{ github.workspace }}/.github/tmp/dist
      FEED_DIR: ${{ github.workspace }}/.github/tmp/release-feed
      APP_NAME: codexpanel.app
      APP_BASENAME: codexpanel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${GITHUB_REF_NAME}"
            RELEASE_URL="${{ github.event.release.html_url }}"
            PUBLISHED_AT="${{ github.event.release.published_at }}"
          else
            VERSION_INPUT="${{ inputs.version }}"
            TAG_INPUT="${{ inputs.release_tag }}"

            if [[ -n "$TAG_INPUT" ]]; then
              TAG="$TAG_INPUT"
            elif [[ -n "$VERSION_INPUT" ]]; then
              TAG="v$VERSION_INPUT"
            else
              TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            fi

            if [[ -n "$VERSION_INPUT" ]]; then
              VERSION="$VERSION_INPUT"
            elif [[ -n "$TAG" ]]; then
              VERSION="${TAG#v}"
            else
              VERSION="$(awk -F ' = ' '/MARKETING_VERSION = / { gsub(/;/, \"\", $2); print $2; exit }' \"$PROJECT/project.pbxproj\")"
            fi

            if [[ -z "$TAG" ]]; then
              TAG="v$VERSION"
            fi

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION="${TAG#v}"
            if [[ -z "$VERSION" ]]; then
              VERSION="$TAG"
            fi
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Invalid MARKETING_VERSION: $VERSION" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "published_at=$PUBLISHED_AT" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Resolve release mode
        id: mode
        shell: bash
        env:
          DEV_CERT_B64: ${{ secrets.MACOS_DEV_CERTIFICATE_P12_BASE64 }}
          DEV_CERT_PASSWORD: ${{ secrets.MACOS_DEV_CERTIFICATE_PASSWORD }}
          DEV_SIGN_IDENTITY: ${{ secrets.MACOS_DEV_SIGN_IDENTITY }}
          DEV_TEAM_ID: ${{ secrets.MACOS_DEV_TEAM_ID }}
          DEVELOPER_ID_CERT_B64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_SIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_SIGN_IDENTITY }}
          DEVELOPER_ID_TEAM_ID: ${{ secrets.MACOS_DEVELOPER_ID_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail

          SIGN_MODE="unsigned"
          TEAM_ID=""
          SIGN_IDENTITY=""
          CERT_B64=""
          CERT_PASSWORD=""
          NOTARIZE="false"

          if [[ -n "$DEVELOPER_ID_CERT_B64" && -n "$DEVELOPER_ID_CERT_PASSWORD" && -n "$DEVELOPER_ID_SIGN_IDENTITY" && -n "$DEVELOPER_ID_TEAM_ID" ]]; then
            SIGN_MODE="developer_id"
            TEAM_ID="$DEVELOPER_ID_TEAM_ID"
            SIGN_IDENTITY="$DEVELOPER_ID_SIGN_IDENTITY"
            CERT_B64="$DEVELOPER_ID_CERT_B64"
            CERT_PASSWORD="$DEVELOPER_ID_CERT_PASSWORD"

            if [[ -n "$NOTARY_APPLE_ID" && -n "$NOTARY_APP_PASSWORD" && -n "$NOTARY_TEAM_ID" ]]; then
              NOTARIZE="true"
            fi
          elif [[ -n "$DEV_CERT_B64" && -n "$DEV_CERT_PASSWORD" && -n "$DEV_SIGN_IDENTITY" && -n "$DEV_TEAM_ID" ]]; then
            SIGN_MODE="development"
            TEAM_ID="$DEV_TEAM_ID"
            SIGN_IDENTITY="$DEV_SIGN_IDENTITY"
            CERT_B64="$DEV_CERT_B64"
            CERT_PASSWORD="$DEV_CERT_PASSWORD"
          fi

          echo "sign_mode=$SIGN_MODE" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "sign_identity=$SIGN_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "notarize=$NOTARIZE" >> "$GITHUB_OUTPUT"

          if [[ -n "$CERT_B64" ]]; then
            echo "cert_b64_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "cert_b64_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: steps.mode.outputs.sign_mode != 'unsigned'
        shell: bash
        env:
          DEV_CERT_B64: ${{ secrets.MACOS_DEV_CERTIFICATE_P12_BASE64 }}
          DEV_CERT_PASSWORD: ${{ secrets.MACOS_DEV_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_CERT_B64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/codexpanel-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/codexpanel-signing.p12"

          if [[ "${{ steps.mode.outputs.sign_mode }}" == "developer_id" ]]; then
            printf '%s' "$DEVELOPER_ID_CERT_B64" | base64 --decode > "$CERT_PATH"
            CERT_PASSWORD_VALUE="$DEVELOPER_ID_CERT_PASSWORD"
          else
            printf '%s' "$DEV_CERT_B64" | base64 --decode > "$CERT_PATH"
            CERT_PASSWORD_VALUE="$DEV_CERT_PASSWORD"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD_VALUE" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build arm64 release app
        run: |
          set -euo pipefail
          rm -rf "$ARM64_DERIVED_DATA" "$X64_DERIVED_DATA" "$UNIVERSAL_APP_DIR" "$DIST_DIR" "$FEED_DIR"
          mkdir -p "$DIST_DIR"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$ARM64_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.meta.outputs.build_number }}" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            build

      - name: Build x86_64 release app
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "platform=macOS,arch=x86_64" \
            -derivedDataPath "$X64_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.meta.outputs.build_number }}" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=x86_64 \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            build

      - name: Assemble universal app
        run: |
          set -euo pipefail

          ARM64_APP="$ARM64_DERIVED_DATA/Build/Products/Release/$APP_NAME"
          X64_APP="$X64_DERIVED_DATA/Build/Products/Release/$APP_NAME"
          UNIVERSAL_APP="$UNIVERSAL_APP_DIR/$APP_NAME"

          if [[ ! -d "$ARM64_APP" || ! -d "$X64_APP" ]]; then
            echo "Missing one or both architecture builds." >&2
            exit 1
          fi

          mkdir -p "$UNIVERSAL_APP_DIR"
          cp -R "$ARM64_APP" "$UNIVERSAL_APP"

          for binary in \
            "Contents/MacOS/codexpanel" \
            "Contents/MacOS/codexpanel.debug.dylib" \
            "Contents/MacOS/__preview.dylib"
          do
            lipo -create \
              "$ARM64_APP/$binary" \
              "$X64_APP/$binary" \
              -output "$UNIVERSAL_APP/$binary"
          done

          file "$UNIVERSAL_APP/Contents/MacOS/codexpanel"

      - name: Sign universal app
        if: steps.mode.outputs.sign_mode != 'unsigned'
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$UNIVERSAL_APP_DIR/$APP_NAME"
          SIGN_IDENTITY="${{ steps.mode.outputs.sign_identity }}"
          ENTITLEMENTS="codexPanel/codexPanel.entitlements"

          if [[ "${{ steps.mode.outputs.sign_mode }}" == "developer_id" ]]; then
            codesign \
              --force \
              --deep \
              --timestamp \
              --options runtime \
              --entitlements "$ENTITLEMENTS" \
              --sign "$SIGN_IDENTITY" \
              "$APP_PATH"
          else
            codesign \
              --force \
              --deep \
              --timestamp=none \
              --entitlements "$ENTITLEMENTS" \
              --sign "$SIGN_IDENTITY" \
              "$APP_PATH"
          fi

      - name: Validate app bundle
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$UNIVERSAL_APP_DIR/$APP_NAME"
          APP_VERSION="$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleShortVersionString)"
          BUILD_VERSION="$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleVersion)"

          echo "bundle_short_version=$APP_VERSION"
          echo "bundle_build_version=$BUILD_VERSION"

          if [[ "$APP_VERSION" != "${{ steps.meta.outputs.version }}" ]]; then
            echo "Expected bundle version ${{ steps.meta.outputs.version }}, got $APP_VERSION" >&2
            exit 1
          fi

          file "$APP_PATH/Contents/MacOS/codexpanel"
          file "$APP_PATH/Contents/MacOS/codexpanel.debug.dylib"
          file "$APP_PATH/Contents/MacOS/__preview.dylib"
          codesign --verify --deep --strict "$APP_PATH" || true
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | sed -n '1,80p' || true
          spctl -a -vv "$APP_PATH" || true

      - name: Package zip and dmg
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.meta.outputs.version }}"
          ZIP_NAME="${APP_BASENAME}-${VERSION}-macOS.zip"
          DMG_NAME="${APP_BASENAME}-${VERSION}-macOS.dmg"
          APP_PATH="$UNIVERSAL_APP_DIR/$APP_NAME"
          STAGING_DIR="$DIST_DIR/staging"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "Built app not found: $APP_PATH" >&2
            exit 1
          fi

          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/$APP_NAME"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$DIST_DIR/$ZIP_NAME"

          hdiutil create \
            -volname "codexpanel" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DIST_DIR/$DMG_NAME"

          shasum -a 256 "$DIST_DIR/$ZIP_NAME" > "$DIST_DIR/$ZIP_NAME.sha256"
          shasum -a 256 "$DIST_DIR/$DMG_NAME" > "$DIST_DIR/$DMG_NAME.sha256"

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Notarize dmg
        if: steps.mode.outputs.notarize == 'true'
        shell: bash
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail

          xcrun notarytool submit \
            "$DIST_DIR/${{ steps.package.outputs.dmg_name }}" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait

          xcrun stapler staple "$DIST_DIR/${{ steps.package.outputs.dmg_name }}"

      - name: Validate packaged artifacts
        shell: bash
        run: |
          set -euo pipefail

          hdiutil verify "$DIST_DIR/${{ steps.package.outputs.dmg_name }}"
          shasum -a 256 \
            "$DIST_DIR/${{ steps.package.outputs.zip_name }}" \
            "$DIST_DIR/${{ steps.package.outputs.dmg_name }}"

      - name: Generate release-feed files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$FEED_DIR"

          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          RELEASE_URL="${{ steps.meta.outputs.release_url }}"
          PUBLISHED_AT="${{ steps.meta.outputs.published_at }}"
          REPO_SLUG="${{ github.repository }}"

          MANIFEST_PATH="$FEED_DIR/${VERSION}.manifest.json"
          VERSION_FEED_PATH="$FEED_DIR/${VERSION}.json"
          STABLE_FEED_PATH="$FEED_DIR/stable.json"

          cat > "$MANIFEST_PATH" <<EOF
          {
            "schemaVersion": 1,
            "channel": "stable",
            "release": {
              "version": "$VERSION",
              "publishedAt": "$PUBLISHED_AT",
              "summary": "版本 $VERSION 发布",
              "releaseNotesURL": "$RELEASE_URL",
              "downloadPageURL": "$RELEASE_URL",
              "deliveryMode": "guidedDownload",
              "minimumAutomaticUpdateVersion": "1.1.6",
              "artifacts": [
                {
                  "architecture": "universal",
                  "format": "dmg",
                  "downloadURL": "https://github.com/$REPO_SLUG/releases/download/$TAG/${{ steps.package.outputs.dmg_name }}",
                  "localPath": "../dist/${{ steps.package.outputs.dmg_name }}"
                },
                {
                  "architecture": "universal",
                  "format": "zip",
                  "downloadURL": "https://github.com/$REPO_SLUG/releases/download/$TAG/${{ steps.package.outputs.zip_name }}",
                  "localPath": "../dist/${{ steps.package.outputs.zip_name }}"
                }
              ]
            }
          }
          EOF

          python3 scripts/generate_update_feed.py "$MANIFEST_PATH" "$VERSION_FEED_PATH"
          cp "$VERSION_FEED_PATH" "$STABLE_FEED_PATH"

      - name: Upload release assets
        if: github.event_name == 'release' || inputs.publish_release_assets == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"

          gh release upload "$TAG" \
            "$DIST_DIR/${{ steps.package.outputs.zip_name }}" \
            "$DIST_DIR/${{ steps.package.outputs.zip_name }}.sha256" \
            "$DIST_DIR/${{ steps.package.outputs.dmg_name }}" \
            "$DIST_DIR/${{ steps.package.outputs.dmg_name }}.sha256" \
            --clobber

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codexpanel-release-assets
          path: |
            ${{ env.DIST_DIR }}/${{ steps.package.outputs.zip_name }}
            ${{ env.DIST_DIR }}/${{ steps.package.outputs.zip_name }}.sha256
            ${{ env.DIST_DIR }}/${{ steps.package.outputs.dmg_name }}
            ${{ env.DIST_DIR }}/${{ steps.package.outputs.dmg_name }}.sha256
            ${{ env.FEED_DIR }}/${{ steps.meta.outputs.version }}.json
            ${{ env.FEED_DIR }}/stable.json

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: codexpanel-release-logs
          path: |
            ${{ env.ARM64_DERIVED_DATA }}/Logs
            ${{ env.X64_DERIVED_DATA }}/Logs
