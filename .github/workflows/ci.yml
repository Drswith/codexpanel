name: CI

on:
  pull_request:
    branches:
      - main
      - "codex/**"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: swift:6.2-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Swift version
        run: swift --version

      - name: Test Core
        run: swift test --package-path Packages/CodexPanelCore

  build:
    name: build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -switch /Applications/Xcode_26.3.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.2.app ]; then
            sudo xcode-select -switch /Applications/Xcode_26.2.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.1.1.app ]; then
            sudo xcode-select -switch /Applications/Xcode_26.1.1.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.0.1.app ]; then
            sudo xcode-select -switch /Applications/Xcode_26.0.1.app/Contents/Developer
          else
            echo "No Xcode 26.x found on runner." >&2
            ls -1 /Applications | rg '^Xcode' || true
            exit 1
          fi
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project codexpanel.xcodeproj \
            -scheme codexpanel \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Development isolation regression tests
        run: |
          xcodebuild \
            -project codexpanel.xcodeproj \
            -scheme codexpanel \
            -destination 'platform=macOS' \
            -only-testing:codexpanelTests/CodexPanelRuntimeProfileTests \
            -only-testing:codexpanelTests/CodexPanelCLIInstallServiceTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test
